<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — VulnSchool</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect width='44' height='44' rx='8' fill='%231D3A5F'/><polygon points='22,6 27,16 38,16 29,23 32,34 22,27 12,34 15,23 6,16 17,16' fill='none' stroke='%23C6942A' stroke-width='1.4'/><circle cx='22' cy='22' r='5' fill='none' stroke='%23C6942A' stroke-width='1.2'/><circle cx='22' cy='22' r='2' fill='%23C6942A' opacity='0.7'/></svg>">
</head>
<body>

<div class="page">
  <nav class="nav">
    <div class="nav-logo">
      <svg class="crest" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="44" height="44" rx="8" fill="#1D3A5F"/>
        <polygon points="22,6 27,16 38,16 29,23 32,34 22,27 12,34 15,23 6,16 17,16" fill="none" stroke="#C6942A" stroke-width="1.4"/>
        <circle cx="22" cy="22" r="5" fill="none" stroke="#C6942A" stroke-width="1.2"/>
      </svg>
      <div class="nav-brand">
        <span class="nav-brand-name">VulnSchool</span>
        <span class="nav-brand-sub">Student Portal</span>
      </div>
    </div>
    <ul class="nav-links">
      <li><a href="index">Home</a></li>
      <li><a href="About">About</a></li>
      <li><a href="#">Programs</a></li>
      <li><a href="register">Admissions</a></li>
      <li><a href="#">Research</a></li>
      <li><a href="Contact">Contact</a></li>
    </ul>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <p class="auth-title">Welcome back</p>
      <p class="auth-sub">Log in to your VulnSchool account</p>

      <form id="login-form">
        <label class="field-label">Email</label>
        <input class="field-input" type="text" id="email" placeholder="name@example.com">

        <label class="field-label">Password</label>
        <input class="field-input" type="password" id="password" placeholder="••••••••">

        <p class="auth-error" id="login-error"></p>

        <button type="submit" class="auth-submit">Log In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="register">Register</a></p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
